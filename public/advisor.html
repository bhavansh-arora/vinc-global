<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<link rel="icon" href="/img/vinc-mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400..800&family=Lora:ital,wght@0,500..700;1,500..700&family=Caveat:wght@500&family=Dancing+Script:wght@600&display=swap">
<script src="/js/theme-init.js"></script>
<link rel="stylesheet" href="/css/vinc.css">
<title>Advisor portal · VINC Global</title>
</head>
<body>
<div id="gate" hidden></div>

<div class="app" id="app" hidden>
  <aside class="side" id="side" aria-label="Portal navigation">
    <a class="brand" href="/" data-brand></a>
    <nav>
      <a href="#home" data-view="home"><span data-ic="home"></span>Home</a>
      <a href="#agreements" data-view="agreements"><span data-ic="file"></span>Agreements<span class="badge" id="agr-badge"></span></a>
      <a href="#news" data-view="news"><span data-ic="news"></span>News</a>
      <a href="#vault" data-view="vault"><span data-ic="vault"></span>Data room</a>
      <a href="#kyc" data-view="kyc"><span data-ic="id"></span>KYC documents<span class="badge" id="kyc-badge"></span></a>
      <a href="#portfolio" data-view="portfolio"><span data-ic="chart"></span>My investment</a>
      <a href="#account" data-view="account"><span data-ic="user"></span>Account</a>
    </nav>
    <div class="side-foot">
      <div class="me"><span class="avatar" id="me-avatar">?</span><div class="who"><b id="me-name"></b><span id="me-uid"></span></div></div>
      <button class="btn btn-soft btn-sm" type="button" data-logout><span data-ic="logout"></span>Log out</button>
    </div>
  </aside>
  <div class="side-scrim" id="side-scrim"></div>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-toggle" type="button" id="menu-toggle" aria-label="Open menu"><span data-ic="menu"></span></button>
      <div class="ttl"><h1 id="view-title">Home</h1><p id="view-sub"></p></div>
      <div class="tools">
        <span class="chip live hide-sm" id="top-price" hidden><span class="dot"></span><span></span></span>
        <button class="icon-btn sound-btn" type="button" data-sound-toggle></button>
        <button class="icon-btn theme-btn" type="button" data-theme-toggle></button>
      </div>
    </header>
    <main class="content" id="content">
      <section class="view" data-view="home" hidden></section>
      <section class="view" data-view="agreements" hidden></section>
      <section class="view" data-view="news" hidden></section>
      <section class="view" data-view="vault" hidden></section>
      <section class="view" data-view="kyc" hidden></section>
      <section class="view" data-view="portfolio" hidden></section>
      <section class="view" data-view="account" hidden></section>
    </main>
  </div>
</div>

<script src="/js/common.js"></script>
<script src="/js/ambient.js"></script>
<script src="/js/viewer.js"></script>
<script src="/vendor/chartjs/chart.umd.min.js"></script>
<script src="/js/queue.js"></script>
<script src="/js/sign.js"></script>
<script src="/js/member-agreements.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/advisor.js"></script>
</body>
</html>
