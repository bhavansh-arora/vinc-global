# VINC Global: one container with its own data volume.
# Caddy (crm-caddy-1) reaches it as http://vinc-global:3000 over the vinc-global-web network;
# port 3010 is bound to 127.0.0.1 only, for testing from the VPS itself.
services:
  vinc-global:
    build: .
    image: vinc-global:latest
    container_name: vinc-global
    restart: unless-stopped
    env_file:                                         # SMTP settings live here, on the server only
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Vinc@2026}   # only used the very first time
      MAX_UPLOAD_MB: "25"
    ports:
      - "127.0.0.1:${VG_PORT:-3010}:3000"
    volumes:
      - vinc-global-data:/data                        # SQLite database + uploads
    networks:
      - vinc-global-web
volumes:
  vinc-global-data:
    name: vinc-global-data
networks:
  vinc-global-web:
    name: vinc-global-web
